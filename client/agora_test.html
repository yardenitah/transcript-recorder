<script>
  const APP_ID = "5deec9e3974849299a1e0a770fcca06d";
  const CHANNEL = "test123";
  const TOKEN = "007eJxTYLgq57lIQnCDg/zMrXs2i6eH3Y93mGb7d/UCURumhDjVNi0FBtOU1NRky1RjS3MTCxNLI0vLRMNUg0Rzc4O05OREA7OUmAPemQ2BjAxmfzazMjJAIIjPzlCSWlxiaGTMwAAA9d0eJw==";
  const UID = 123;

  const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

  let localAudioTrack;
  let localVideoTrack;
  let isMuted = false;
  let volumeTimer = null;

  client.on("connection-state-change", (curState, prevState, reason) => {
    console.log(`[RTC] connection-state-change: ${prevState} -> ${curState} | reason=${reason}`);
  });

  async function joinCall() {
    try {
      document.getElementById("status").innerText = "Connecting...";
      AgoraRTC.setLogLevel(4); // DEBUG

      console.log("[1] Joining channel...");
      await client.join(APP_ID, CHANNEL, TOKEN, UID);
      console.log("[1] Joined OK");

      console.log("[2] Creating mic+camera tracks...");
      [localAudioTrack, localVideoTrack] = await AgoraRTC.createMicrophoneAndCameraTracks();
      console.log("[2] Tracks created:", {
        hasAudio: !!localAudioTrack,
        hasVideo: !!localVideoTrack
      });

      localVideoTrack.play("video-container");
      console.log("[3] Local video playing");

      console.log("[4] Publishing tracks...");
      await client.publish([localAudioTrack, localVideoTrack]);
      console.log("[4] Published OK ✅ (audio+video)");

      if (volumeTimer) clearInterval(volumeTimer);
      volumeTimer = setInterval(() => {
        if (!localAudioTrack) return;
        const level = localAudioTrack.getVolumeLevel(); // 0..1
        if (level > 0.01) console.log(`[MIC] volume=${level.toFixed(3)}`);
      }, 500);

      document.getElementById("status").innerText = "✅ LIVE: Broadcasting Audio & Video";
      document.getElementById("joinBtn").style.display = "none";
      document.getElementById("leaveBtn").style.display = "inline-block";
      document.getElementById("muteBtn").style.display = "inline-block";
    } catch (error) {
      console.error("Join failed:", error);
      document.getElementById("status").innerText = "❌ Error: " + error.message;
    }
  }

  async function leaveCall() {
    if (volumeTimer) {
      clearInterval(volumeTimer);
      volumeTimer = null;
    }
    if (localAudioTrack) { localAudioTrack.stop(); localAudioTrack.close(); }
    if (localVideoTrack) { localVideoTrack.stop(); localVideoTrack.close(); }
    await client.leave();

    document.getElementById("status").innerText = "Status: Disconnected";
    document.getElementById("joinBtn").style.display = "inline-block";
    document.getElementById("leaveBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "none";
    document.getElementById("muteBtn").innerText = "MUTE MIC";
    document.getElementById("muteBtn").classList.remove("muted");
    isMuted = false;

    document.getElementById("video-container").innerHTML = "";
    console.log("Left channel successfully.");
  }

  function toggleMute() {
    if (!localAudioTrack) return;

    if (isMuted) {
      localAudioTrack.setMuted(false);
      isMuted = false;
      document.getElementById("muteBtn").innerText = "MUTE MIC";
      document.getElementById("muteBtn").classList.remove("muted");
      console.log("Mic Unmuted");
    } else {
      localAudioTrack.setMuted(true);
      isMuted = true;
      document.getElementById("muteBtn").innerText = "UNMUTE";
      document.getElementById("muteBtn").classList.add("muted");
      console.log("Mic Muted");
    }
  }
</script>
