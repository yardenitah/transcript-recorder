<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agora Client - Lightweight</title>
  <style>
    /* Basic styling for a clean UI */
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
    h1 { color: #333; margin-bottom: 20px; }
    #status { margin: 20px 0; padding: 10px; background: #e8f0fe; border-radius: 6px; color: #1a73e8; font-weight: 500; }
    .controls { display: flex; gap: 10px; justify-content: center; }
    button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: all 0.2s; }

    #joinBtn { background: #007bff; color: white; }
    #joinBtn:hover { background: #0056b3; }
    #joinBtn:disabled { background: #ccc; cursor: not-allowed; }

    #leaveBtn { background: #dc3545; color: white; }
    #leaveBtn:hover { background: #a71d2a; }
    #leaveBtn:disabled { background: #ccc; cursor: not-allowed; }

    #muteBtn { background: #6c757d; color: white; }
    #muteBtn:hover { background: #5a6268; }
    #muteBtn:disabled { background: #ccc; cursor: not-allowed; }
    /* Style for when muted */
    #muteBtn.muted { background: #ffc107; color: #333; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎙️ Guest Client</h1>
  <p>Connects to Agora only. Audio is routed to the server via the Bot.</p>

  <div id="status">Ready to join...</div>

  <div class="controls">
    <button id="joinBtn">Join Channel</button>
    <button id="muteBtn" disabled>Mute</button>
    <button id="leaveBtn" disabled>Leave</button>
  </div>
</div>

<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<script>
  // --- CONFIG ---
  // Connects to your Python backend (EC2) to fetch credentials securely.
  // The client NEVER talks directly to Soniox or the Transcript service.
  const API_BASE = "http://ec2-18-153-73-55.eu-central-1.compute.amazonaws.com:8000";


  let client = null;
  let localAudioTrack = null;
  let isMuted = false;

  const statusDiv = document.getElementById("status");
  const joinBtn = document.getElementById("joinBtn");
  const leaveBtn = document.getElementById("leaveBtn");
  const muteBtn = document.getElementById("muteBtn");

  function updateStatus(msg) { statusDiv.textContent = msg; }

  /**
   * Main function to join the Agora Channel.
   * Flow: Fetch Config -> Init SDK -> Join -> Publish Mic
   */
  async function join() {
    try {
      joinBtn.disabled = true;
      updateStatus("Fetching config...");

      // 1. Fetch Config from Backend
      // We retrieve AppID, Channel Name, and Token securely.
      const res = await fetch(`${API_BASE}/agora-config`);
      const cfg = await res.json();

      // 2. Init Agora Client
      // Create the local client object for handling the call.
      client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

      // 3. Join the Channel
      updateStatus("Joining channel...");
      const uid = await client.join(cfg.app_id, cfg.channel, cfg.token || null, null);

      // 4. Create & Publish Microphone Track (CRITICAL STEP)
      // This captures user audio and sends it to Agora Cloud.
      // The Electron Bot (running on the server) listens to this stream.
      localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
      await client.publish([localAudioTrack]);

      updateStatus(`Connected as UID: ${uid}`);

      // Enable UI controls
      leaveBtn.disabled = false;
      muteBtn.disabled = false;

      // Reset mute state
      isMuted = false;
      muteBtn.innerText = "Mute";
      muteBtn.classList.remove("muted");

    } catch (e) {
      console.error(e);
      updateStatus("Error: " + e.message);
      joinBtn.disabled = false;
    }
  }

  /**
   * Leave the channel and clean up resources.
   */
  async function leave() {
    // 1. Stop Microphone access (hardware)
    if (localAudioTrack) {
      localAudioTrack.close();
      localAudioTrack = null;
    }
    // 2. Disconnect from Agora Cloud
    if (client) {
      await client.leave();
      client = null;
    }
    updateStatus("Disconnected");

    // Reset buttons and UI
    joinBtn.disabled = false;
    leaveBtn.disabled = true;
    muteBtn.disabled = true;
    muteBtn.innerText = "Mute";
    muteBtn.classList.remove("muted");
    isMuted = false;
  }

  /**
   * Toggle Microphone Mute state.
   * Note: This stops sending audio frames.
   * The backend server will detect silence and send keep-alive packets to Soniox.
   */
  async function toggleMute() {
    if (!localAudioTrack) return;

    isMuted = !isMuted;

    // Enable/Disable the track transmission
    await localAudioTrack.setEnabled(!isMuted);

    if (isMuted) {
        muteBtn.innerText = "Unmute";
        muteBtn.classList.add("muted");
        updateStatus("Microphone Muted 🔇");
    } else {
        muteBtn.innerText = "Mute";
        muteBtn.classList.remove("muted");
        updateStatus("Microphone Active 🎤");
    }
  }

  // Bind buttons to functions
  joinBtn.onclick = join;
  leaveBtn.onclick = leave;
  muteBtn.onclick = toggleMute;
</script>
</body>
</html>
